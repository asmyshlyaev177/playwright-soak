library:
  name: 'playwright-soak'
  version: '0.1.0'
  repository: 'https://github.com/asmyshlyaev177/playwright-soak'
  description: 'Repeat a Playwright flow a few hundred times, force GC, and fail the test when DOM nodes, listeners, documents or heap keep piling up.'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'Measuring a repeated flow'
    slug: 'measurement'
    description: >
      Setting up the CDP session and the loop that produces readings: what the
      flow does, how many times it runs, how often the counters are sampled,
      and the Playwright configuration a run of that length needs.
  - name: 'Judging what the readings mean'
    slug: 'judgement'
    description: >
      Turning a series of readings into a verdict: which growth counts as
      accumulation rather than a one-off step, which threshold to move and
      which to leave alone, and what each reported metric points at.
  - name: 'Budgeting the browser own cost'
    slug: 'browser-cost'
    description: >
      Separating retention the browser charges for its own bookkeeping from
      retention the application under test is responsible for. Today this is
      text editing, which retains roughly one node per gesture.

skills:
  - name: 'Writing a soak test'
    slug: 'writing-soak-tests'
    domain: 'measurement'
    description: >
      Wire attachCDP and soak into a Playwright spec, shape a flow that can be
      repeated, and configure the project so a few hundred iterations can run.
    type: 'core'
    covers:
      - 'attachCDP'
      - 'soak'
      - 'SoakOptions.iterations'
      - 'SoakOptions.warmup'
      - 'SoakOptions.sampleEvery'
      - 'getPageMetrics'
      - 'playwright.config.ts settings for long runs'
    tasks:
      - 'Add a memory leak test for an open/close interaction'
      - 'Soak route navigation in a single-page app'
      - 'Configure a Playwright project so soak runs do not time out'
      - 'Prove a soak test can fail before trusting it'
    failure_modes:
      - mistake: 'Soak result computed but never asserted'
        mechanism: >
          soak only measures and returns readings, so a spec that logs the
          result without calling expectNoLeak or inspecting checkLeaks passes
          on every leak.
        wrong_pattern: |
          const result = await soak({ client, flow });
          console.log(formatSoak('drawer', result));
        correct_pattern: |
          const result = await soak({ client, flow });
          console.log(formatSoak('drawer', result));
          expectNoLeak(result);
        source: 'src/soak.ts:42-49'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['writing-soak-tests', 'interpreting-results']
      - mistake: 'Flow derives page state from the iteration index'
        mechanism: >
          warmup rounds run before iteration 0, so the page has already
          advanced by warmup steps when the index says zero.
        wrong_pattern: |
          flow: async (i) => {
            await page.getByRole('button', { name: 'Next' }).click();
            await expect(page.getByTestId('page')).toHaveText(String(i + 1));
          }
        correct_pattern: |
          flow: async () => {
            await page.getByRole('button', { name: 'Next' }).click();
            await page.getByRole('button', { name: 'Previous' }).click();
          }
        source: 'src/soak.ts:57-59, src/soak.ts:85-102'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Non-Chromium projects left in the Playwright config'
        mechanism: >
          attachCDP opens a CDP session, which only Chromium implements, so
          Firefox and WebKit projects error before any reading is taken.
        wrong_pattern: |
          projects: [
            { name: 'chromium', use: { ...devices['Desktop Chrome'] } },
            { name: 'firefox', use: { ...devices['Desktop Firefox'] } },
          ]
        correct_pattern: |
          projects: [{ name: 'chromium', use: { ...devices['Desktop Chrome'] } }]
        source: 'src/metrics.ts:15-26'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Default Playwright timeout left in place'
        mechanism: >
          Hundreds of iterations plus two forced collections per reading run
          well past the 30s default, and the failure surfaces as a locator
          timeout that reads like a flaky selector.
        wrong_pattern: |
          export default defineConfig({ testDir: './e2e' });
        correct_pattern: |
          export default defineConfig({
            testDir: './e2e',
            timeout: 3 * 60 * 1000,
            workers: 1,
            fullyParallel: false,
          });
        source: 'playwright.config.ts:6-8, examples/tanstack-spa/playwright.config.ts:5-9'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Run too short for the heap check to engage'
        mechanism: >
          The heap check compares second-half growth against
          max(firstHalf * heapRatio, heapNoise), and with heapNoise at 256KB a
          short run rarely clears the floor, so a heap-only leak passes.
        wrong_pattern: |
          const result = await soak({ client, flow, iterations: 20 });
        correct_pattern: |
          const result = await soak({ client, flow, iterations: 200 });
        source: 'src/assert.ts:38-45, src/assert.ts:165-178'
        priority: 'HIGH'
        status: 'active'
        skills: ['writing-soak-tests', 'interpreting-results']
      - mistake: 'Page reloaded inside the flow'
        mechanism: >
          A full navigation replaces the document and drops everything the
          previous one retained, so accumulation resets each round and every
          counter reads flat.
        wrong_pattern: |
          flow: async () => {
            await page.goto('/dashboard');
            await page.getByRole('button', { name: 'Open details' }).click();
          }
        correct_pattern: |
          await page.goto('/dashboard');
          const client = await attachCDP(page);
          const result = await soak({
            client,
            flow: async () => {
              await page.getByRole('button', { name: 'Open details' }).click();
              await page.getByRole('button', { name: 'Close details' }).click();
            },
          });
        source: 'README.md (Usage), examples/tanstack-spa/e2e/soak.spec.ts:23-32'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'sampleEvery set so coarse the run has no shape'
        mechanism: >
          Every check reads the series between readings; with one reading there
          are no stretches to compare, so metricHalves returns undefined, the
          heap check is skipped and any counter growth reads as a leak.
        wrong_pattern: |
          const result = await soak({
            client,
            flow,
            iterations: 200,
            sampleEvery: 200,
          });
        correct_pattern: |
          const result = await soak({ client, flow, iterations: 200 });
        source: 'src/soak.ts:153-168, src/assert.ts:84-91, test/soak.spec.ts:242-257'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Soaking the dev server instead of a production build'
        mechanism: >
          The HMR client allocates on its own schedule, so its growth lands in
          the heap curve and is charged to the flow.
        wrong_pattern: |
          webServer: { command: 'npm run dev', url: 'http://localhost:5173' }
        correct_pattern: |
          webServer: {
            command: 'npm run build && npm run preview',
            url: 'http://localhost:4173',
            reuseExistingServer: false,
          }
        source: 'examples/tanstack-spa/playwright.config.ts:14-24'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Interpreting a soak result'
    slug: 'interpreting-results'
    domain: 'judgement'
    description: >
      Decide whether a run actually leaked, read the formatSoak block, and know
      which threshold is worth moving and which is load-bearing.
    type: 'core'
    covers:
      - 'expectNoLeak'
      - 'checkLeaks'
      - 'LeakThresholds'
      - 'LeakFinding'
      - 'formatSoak'
      - 'heapHalves'
      - 'metricHalves'
      - 'metricStretches'
    tasks:
      - 'Decide whether a red soak run is a real leak'
      - 'Tune thresholds for an application with a large DOM'
      - 'Read the formatSoak block printed by a failing run'
      - 'Assert on individual metrics instead of the whole verdict'
    failure_modes:
      - mistake: 'checkLeaks used as if it asserts'
        mechanism: >
          checkLeaks is pure: it returns findings and never throws, so calling
          it for its side effect leaves the test green on every leak.
        wrong_pattern: |
          checkLeaks(result, { nodes: 200 });
        correct_pattern: |
          expect(checkLeaks(result, { nodes: 200 })).toEqual([]);
        source: 'src/assert.ts:99-108'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Endpoint delta asserted instead of expectNoLeak'
        mechanism: >
          A single before/after delta cannot separate a leak from a one-off
          step, so a lazily registered global fails it while growth spread
          thinly across the run slips under it.
        wrong_pattern: |
          expect(result.after.nodes - result.baseline.nodes).toBeLessThan(100);
        correct_pattern: |
          expectNoLeak(result);
        source: 'src/assert.ts:61-91, test/soak.spec.ts:98-121'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Thresholds raised until the run goes green'
        mechanism: >
          The counter checks already discard one-off steps, so a reported
          counter is spread-out accumulation and a larger allowance only moves
          the iteration count at which it is noticed.
        wrong_pattern: |
          expectNoLeak(result, { nodes: 5000, listeners: 50 });
        correct_pattern: |
          expectNoLeak(result, { nodes: 100 });
        source: 'src/assert.ts:61-91, src/assert.ts:121-138'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'heapNoise dropped to zero to make the heap check strict'
        mechanism: >
          Without the floor the check compares two readings that may differ
          only by collector noise, so an already-flat flow fails at random.
        wrong_pattern: |
          expectNoLeak(result, { heapNoise: 0, heapRatio: 0.1 });
        correct_pattern: |
          const result = await soak({ client, flow, iterations: 400 });
          expectNoLeak(result);
        source: 'src/assert.ts:38-45, src/assert.ts:165-178'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Heap finding read as heap grew too much'
        mechanism: >
          checkLeaks never bounds absolute heap growth; it compares second-half
          growth to first-half growth, so shrinking allocations does not clear
          a finding that is about slope.
        wrong_pattern: |
          expectNoLeak(result, { heapRatio: 2 });
        correct_pattern: |
          const halves = heapHalves(result);
          console.log(halves?.first, halves?.second, halves?.midIteration);
        source: 'src/assert.ts:165-178, src/soak.ts:143-168'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'Soaking a typing flow'
    slug: 'typing-flows'
    domain: 'browser-cost'
    description: >
      Measure what the browser charges per editing gesture and budget for it,
      so a soak test over an input is judged on the application rather than on
      Chromium bookkeeping.
    type: 'core'
    covers:
      - 'calibrateTypingCost'
      - 'TypingGesture'
      - 'LeakThresholds.typingCost'
      - 'formatSoak extra.typingCost'
    tasks:
      - 'Soak a form field without the run failing on browser bookkeeping'
      - 'Measure the per-gesture node cost of an editing interaction'
      - 'Fix a typing soak test written off as flaky'
    failure_modes:
      - mistake: 'calibrateTypingCost called after the baseline'
        mechanism: >
          The control input and the browser per-gesture retention then land
          inside the measured window and are charged to the flow.
        wrong_pattern: |
          const result = await soak({ client, flow: () => type(field) });
          const typingCost = await calibrateTypingCost(page, client, type);
          expectNoLeak(result, { typingCost });
        correct_pattern: |
          const typingCost = await calibrateTypingCost(page, client, type);
          const result = await soak({ client, flow: () => type(field) });
          expectNoLeak(result, { typingCost });
        source: 'src/typing.ts:20-22, src/typing.ts:34-54'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'typingCost measured but never passed to expectNoLeak'
        mechanism: >
          The browser retains about one node per editing gesture whatever the
          application does, so over a few hundred iterations that alone clears
          the default 100-node allowance.
        wrong_pattern: |
          const typingCost = await calibrateTypingCost(page, client, type);
          expectNoLeak(result);
        correct_pattern: |
          const typingCost = await calibrateTypingCost(page, client, type);
          expectNoLeak(result, { typingCost });
        source: 'src/typing.ts:7-27, src/assert.ts:140-149'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Calibration gesture differs from the flow gesture'
        mechanism: >
          calibrateTypingCost charges per call of the gesture it is handed, and
          fill() is one edit where pressSequentially of five characters is
          five, so the budget comes out a fraction of what the flow spends.
        wrong_pattern: |
          const typingCost = await calibrateTypingCost(page, client, (l) =>
            l.fill('hello'),
          );
          const result = await soak({
            client,
            flow: () => field.pressSequentially('hello', { delay: 5 }),
          });
        correct_pattern: |
          const type = async (locator: Locator) => {
            await locator.fill('');
            await locator.pressSequentially('hello', { delay: 5 });
          };
          const typingCost = await calibrateTypingCost(page, client, type);
          const result = await soak({ client, flow: () => type(field) });
        source: 'src/typing.ts:24-26, examples/tanstack-spa/e2e/soak.spec.ts:148-170'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Node allowance raised instead of budgeting typing cost'
        mechanism: >
          typingCost scales with the iteration count while a fixed allowance
          does not, so a hand-picked number is right at one run length and
          either too tight or blind to a real leak at every other.
        wrong_pattern: |
          expectNoLeak(result, { nodes: 400 });
        correct_pattern: |
          expectNoLeak(result, { typingCost });
        source: 'src/assert.ts:140-141'
        priority: 'MEDIUM'
        status: 'active'

tensions:
  - name: 'Fast CI runs blunt the heap check'
    skills: ['writing-soak-tests', 'interpreting-results']
    description: >
      Short runs keep a soak suite cheap enough to run on every pull request,
      but the heap check needs first-half growth above twice heapNoise before
      it can fire, which on a typical application means a few hundred rounds.
    implication: >
      An agent trimming iterations for speed produces a suite that still
      catches node, listener and document leaks but silently stops catching
      heap-only ones, and a green run reads as broader coverage than it is.
  - name: 'Threshold tuning versus signal preservation'
    skills: ['interpreting-results', 'typing-flows']
    description: >
      Applications with a large or noisy DOM do sometimes need a larger node
      allowance, but the same edit silences genuine accumulation.
    implication: >
      An agent asked to make a red suite green raises nodes and listeners,
      when the growth it is absorbing is exactly the growth the concentration
      rule already declared to be a leak rather than a step.

cross_references:
  - from: 'writing-soak-tests'
    to: 'interpreting-results'
    reason: >
      Choosing iterations and sampleEvery decides which checks can fire, so the
      loop cannot be sized sensibly without knowing what the verdict reads.
  - from: 'interpreting-results'
    to: 'typing-flows'
    reason: >
      A node finding on a flow that types is usually the browser per-gesture
      charge rather than the application, and typingCost is the fix.
  - from: 'typing-flows'
    to: 'writing-soak-tests'
    reason: >
      Calibration has to happen before the baseline, which is an ordering
      constraint on the surrounding spec rather than on the gesture itself.

gaps:
  - skill: 'writing-soak-tests'
    question: >
      Which Playwright configuration settings are hard requirements for a soak
      run and which are maintainer preference? workers 1 and fullyParallel
      false appear in both configs in the repository without a stated reason.
    context: >
      The skills currently present the raised timeout and the Chromium-only
      project list as requirements with a mechanism, and workers 1 as a
      convention, because only the first two are traceable to source.
    status: 'open'
  - skill: 'writing-soak-tests'
    question: >
      What iteration count should an agent reach for by default? The package
      test suite runs 60, the example application runs 80, and the documented
      default is 200.
    context: >
      The heap check needs roughly 200 iterations on a typical application, so
      the shorter runs in the repository are counter-only by construction.
    status: 'open'
  - skill: 'interpreting-results'
    question: >
      When is raising the nodes allowance the right answer rather than a way
      of hiding a leak, and what does a legitimate raise look like?
    context: >
      The skill currently treats every raise as suspect, which may be too
      strict for applications with a genuinely large fixed DOM cost per round.
    status: 'open'
  - skill: 'typing-flows'
    question: >
      Does the browser charge a comparable per-gesture cost for interactions
      other than text editing, such as drag or scroll, that would deserve the
      same calibration treatment?
    context: >
      calibrateTypingCost is specific to editing gestures today; whether other
      gesture families need the same budgeting is not derivable from source.
    status: 'open'
  - skill: 'interpreting-results'
    question: >
      Which mistakes would an AI coding agent make here that a human would
      not, and what makes a generated soak test recognisably generated?
    context: >
      No GitHub issues or discussions exist yet to mine for real failure
      modes, so every entry is grounded in source, tests or the README.
    status: 'open'
